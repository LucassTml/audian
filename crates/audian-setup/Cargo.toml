[package]
name = "audian-setup"
description = "Audian installer / uninstaller"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "audian-setup"
path = "src/main.rs"

[dependencies]
audian-common.workspace = true
audian-art.workspace = true
audian-ui.workspace = true
anyhow.workspace = true
log.workspace = true
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
miniz_oxide = "0.8"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
audian-build.workspace = true
miniz_oxide = "0.8"
